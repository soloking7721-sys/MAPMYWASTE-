{% extends "base.html" %}

{% block title %}Admin Map - MapMyWaste{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #admin-map {
        height: 600px;
        width: 100%;
        border-radius: 8px;
    }
    .map-legend {
        position: absolute;
        top: 10px;
        right: 10px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        z-index: 1000;
    }
    .map-empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        z-index: 1000;
        text-align: center;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Waste Reports Map</h2>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-lg">
        <div class="card-body p-4" style="position: relative;">
            <div id="admin-map"></div>
            <div class="map-legend">
                <h6 class="mb-2">Legend</h6>
                <div><i class="bi bi-circle-fill text-primary"></i> Waste Reports</div>
            </div>
            <div class="map-empty-state" id="map-empty-state">
                <i class="bi bi-inbox" style="font-size: 2rem; color: #ccc;"></i>
                <p class="mb-0 mt-2 text-muted">No reports yet</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize map with a Mumbai-area placeholder view; real markers/fitBounds take over below
    const map = L.map('admin-map').setView([19.0760, 72.8777], 11);

    // Add tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Reports data from template
    const reportsData = [
        {% for report in reports %}
        {
            id: {{ report.id }},
            latitude: {{ report.latitude }},
            longitude: {{ report.longitude }},
            address: {{ (report.address if report.address else "Location unavailable") | tojson }},
            description: {{ (report.description or '') | tojson }},
            image_filename: {{ report.image_filename | tojson }},
            user_name: {{ report.user.name | tojson }},
            created_at: {{ report.created_at.isoformat() | tojson }},
            location_source: {{ report.location_source | tojson }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];

    // Add report markers
    const reportMarkers = [];
    reportsData.forEach(report => {
        const marker = L.circleMarker([report.latitude, report.longitude], {
            radius: 6,
            fillColor: '#0d6efd',
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
        }).addTo(map);

        const popupContent = `
            <div style="max-width: 250px;">
                <img src="/uploads/${report.image_filename}"
                     style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 8px;">
                <strong>User:</strong> ${report.user_name}<br>
                <strong>Location:</strong> ${report.address}<br>
                <strong>Description:</strong> ${report.description || 'No description'}<br>
                <strong>Date:</strong> ${new Date(report.created_at).toLocaleString()}<br>
                <strong>Source:</strong> ${report.location_source}
            </div>
        `;
        marker.bindPopup(popupContent);
        reportMarkers.push(marker);
    });

    // Fit map to show all markers, or show an empty state when there are none
    if (reportsData.length > 0) {
        const group = new L.featureGroup(reportMarkers);
        map.fitBounds(group.getBounds().pad(0.1));
    } else {
        document.getElementById('map-empty-state').style.display = 'block';
    }
</script>
{% endblock %}
