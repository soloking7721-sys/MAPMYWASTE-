services:
  - type: web
    name: mapmywaste
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mapmywaste-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py
      - key: PYTHON_VERSION
        value: 3.10.12

databases:
  - name: mapmywaste-db
    plan: free
