services:
  - type: web
    name: mapmywaste
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_BUCKET
        value: waste-images
      # The following are managed manually in the Render dashboard (secrets /
      # connection strings) — this file documents that they exist but does not
      # set or overwrite their values.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
